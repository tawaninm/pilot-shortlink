name = "pilot-shortlink-a"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "pilot-shortlink-a"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder for local dev; replace before production deploy
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "http://localhost:8787"

[observability]
enabled = true
