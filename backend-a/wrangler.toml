name = "pilot-shortlink-a"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "pilot-shortlink-a"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder for local dev
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "http://localhost:8787"

[observability]
enabled = true

[env.production]
name = "pilot-shortlink-a"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pilot-shortlink-a"
database_id = "c268b5cc-8324-4084-8325-2ea58450c665" # created 2026-11-18, region APAC
migrations_dir = "migrations"

[env.production.vars]
APP_ORIGIN = "https://pilot-shortlink-a.pilot-shortlink-hash-cpu-spike.workers.dev" # subdomain auto-named by the first spike; Tawan may rename it later (then change this and redeploy)
TURNSTILE_SITE_KEY = "0x4AAAAAAGI0V4iFMlXGFN-0" # public Cloudflare Turnstile site key (not a secret; the secret key is TURNSTILE_SECRET)

[env.production.observability]
enabled = true
