name = "pilot-shortlink-a"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "pilot-shortlink-a"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder for local dev
migrations_dir = "migrations"

[vars]
APP_ORIGIN = "http://localhost:8787"

[observability]
enabled = true

[env.production]
name = "pilot-shortlink-a"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pilot-shortlink-a"
database_id = "c268b5cc-8324-4084-8325-2ea58450c665" # created 2026-11-18, region APAC
migrations_dir = "migrations"

[env.production.vars]
APP_ORIGIN = "https://pilot-shortlink-a.<SUBDOMAIN>.workers.dev" # [TBC] replace <SUBDOMAIN> with the account's workers.dev subdomain

[env.production.observability]
enabled = true
