[package]
name = "pilot_shortlink_a"
version = "0.1.0"
edition = "2021"
publish = false
description = "pilot-shortlink backend A: Cloudflare Workers (Rust) + D1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
worker = { version = "=0.9.0", features = ["d1"] }

[dev-dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
