openapi: 3.1.0
info:
  title: pilot-shortlink API
  version: 0.3.0
  description: |
    สัญญากลางของ backend A (Cloudflare Workers + Rust + D1) และ B (Go + Neon) ทั้งสองต้องผ่าน contract test ชุดเดียวกัน
    Auth ใช้ cookie `__Host-session` (HttpOnly, Secure, SameSite=Lax, Path=/, ไม่มี Domain, 7 วัน prefix `__Host-` บังคับให้ browser รับเฉพาะ cookie ที่ตั้งจาก origin นี้ผ่าน HTTPS) ทุก response ที่ต้อง login ตอบ `Cache-Control: no-store` และหน้า HTML ตอบ `Strict-Transport-Security` request ที่เปลี่ยนข้อมูล (POST, PATCH, DELETE ที่ต้อง login) ต้องมี header `Origin` ตรงกับโดเมนของแอป ไม่มีหรือไม่ตรงตอบ 403 `forbidden_origin` ไม่ประกาศเป็น parameter เพราะ browser ใส่ให้เองและโค้ด frontend ตั้งค่าไม่ได้
    Error ทุกตัวเป็น `application/problem+json` (RFC 9457) และมี `code` ให้ frontend เลือกข้อความ
    ลิงก์ที่ไม่มีและลิงก์ของคนอื่นตอบ 404 รูปแบบเดียวกัน ไม่บอกว่ามีอยู่
    endpoint ใน `/api/auth/` ที่ไม่ต้อง login (register, login, verify-email, password/*) ตรวจ `Origin` แบบเดียวกัน
    ลิงก์ในอีเมลสร้างจาก `APP_ORIGIN` ใน config: `<APP_ORIGIN>/verify-email?token=<token>` และ `<APP_ORIGIN>/reset-password?token=<token>`
    เมื่อรันด้วย `MAIL_MODE=capture` เท่านั้น backend มี `GET /api/test/mail?to=<email>` สำหรับ contract test (ดู `contract/src/client.ts`) route นี้ไม่อยู่ในสัญญาและบน production ต้องตอบ 404
    Login ด้วย Google/GitHub ใช้ Authorization Code + PKCE (S256) + state ใช้ครั้งเดียวผูกกับ cookie `__Host-oauth` (HttpOnly, Secure, SameSite=Lax, Path=/, Max-Age=600) `redirect_uri` = `<APP_ORIGIN>/api/auth/oauth/<provider>/callback` ผูกกับบัญชีอีเมลเดียวกันเฉพาะเมื่อ provider ยืนยันอีเมล ตัวระบุบัญชีคือ (provider, subject)
    `OAUTH_MODE=fake` (ชี้ provider ไป `OAUTH_FAKE_BASE`) และ `TURNSTILE_MODE=fake` (ยอมรับ captcha `fake-pass` เท่านั้น) เปิดได้เฉพาะเมื่อ `APP_ORIGIN` เป็น localhost ใช้กับ contract/e2e เท่านั้น
servers:
  - url: /
security:
  - session: []
paths:
  /api/auth/register:
    post:
      summary: สมัครและเข้าสู่ระบบทันที
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBody' }
      responses:
        '201':
          description: สร้างบัญชีแล้ว
          headers: { Set-Cookie: { $ref: '#/components/headers/SessionCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      summary: เข้าสู่ระบบ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: เข้าสู่ระบบแล้ว
          headers: { Set-Cookie: { $ref: '#/components/headers/SessionCookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/logout:
    post:
      summary: ออกจากระบบ ทำให้ session เดิมใช้ไม่ได้ทันที
      responses:
        '204': { description: ออกจากระบบแล้ว (เรียกซ้ำได้ ผลเท่าเดิม) }
  /api/auth/verify-email:
    post:
      summary: ยืนยัน email ด้วย token จากอีเมล (ไม่ต้อง login เพราะอาจเปิดอีเมลบนเครื่องอื่น)
      description: |
        token สุ่ม 32 byte base64url หมดอายุ 30 นาที ใช้ได้ครั้งเดียว ใช้ได้เฉพาะ token จุดประสงค์ยืนยัน email
        token ผิด หมดอายุ ใช้แล้ว หรือเป็น token รีเซ็ตรหัสผ่าน ตอบ 400 `token_invalid` เหมือนกันทุกกรณี
        ยืนยันพร้อมกันด้วย token เดียวกันสำเร็จได้ครั้งเดียว หน้าเว็บเรียก endpoint นี้ด้วย POST ไม่มี GET
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenBody' }
      responses:
        '204': { description: ยืนยันแล้ว }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/auth/verify-email/resend:
    post:
      summary: ส่งอีเมลยืนยันใหม่ token ก่อนหน้าใช้ไม่ได้ทันที
      description: ไม่เกิน 3 ครั้งต่อชั่วโมงต่อบัญชี (ไม่นับอีเมลตอนสมัคร) ถ้ายืนยันแล้วตอบ 204 และไม่ส่งอีเมล
      responses:
        '204': { description: รับคำขอแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/forgot:
    post:
      summary: ขอลิงก์รีเซ็ตรหัสผ่านทางอีเมล
      description: ตอบ 204 เหมือนกันไม่ว่ามี email นี้หรือไม่ ส่งอีเมลเฉพาะ email ที่มีบัญชี ไม่เกิน 3 ฉบับต่อชั่วโมงต่อ email คำขอที่เกินตอบ 204 แต่ไม่ส่งอีเมลและไม่ยกเลิก token เดิม (ไม่ตอบ 429 เพื่อไม่ให้คนอื่นล็อกเจ้าของบัญชี) ขอใหม่ภายในโควตาแล้ว token รีเซ็ตก่อนหน้าใช้ไม่ได้
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                captcha: { $ref: '#/components/schemas/Captcha' }
      responses:
        '204': { description: รับคำขอแล้ว }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/auth/password/reset:
    post:
      summary: ตั้งรหัสผ่านใหม่ด้วย token จากอีเมล
      description: |
        สำเร็จแล้ว session ทั้งหมดของบัญชีใช้ไม่ได้ทันที และถือว่ายืนยัน email แล้ว ไม่ login ให้ ผู้ใช้ต้อง login ด้วยรหัสใหม่
        ตรวจรหัสผ่านก่อนใช้ token: รหัสสั้นเกินตอบ 422 `weak_password` และ token ยังใช้ได้
        token ผิด หมดอายุ ใช้แล้ว หรือเป็น token ยืนยัน email ตอบ 400 `token_invalid`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { $ref: '#/components/schemas/EmailToken' }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: เปลี่ยนรหัสผ่านแล้ว }
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/auth/oauth/{provider}/start:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      summary: เริ่ม login ด้วย Google หรือ GitHub
      description: สร้าง state และ PKCE verifier (เก็บ hash ของ state ฝั่ง server อายุ 10 นาที) ตั้ง cookie `__Host-oauth=<state>` แล้วพาไปหน้า authorize ของ provider พร้อม `code_challenge_method=S256`
      security: []
      responses:
        '302':
          description: ไปหน้า authorize ของ provider
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/oauth/{provider}/callback:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      summary: provider พากลับมาหลัง login
      description: |
        ตรวจ state กับ cookie `__Host-oauth` ใช้ state ได้ครั้งเดียว แลก code ด้วย `code_verifier` ดึงตัวตน หาบัญชีจาก (provider, subject) ไม่เจอแล้วอีเมลตรงบัญชีเดิมและ provider ยืนยันอีเมล ผูกกับบัญชีนั้น ไม่มีบัญชีสร้างใหม่ (`emailVerified: true`, ไม่มีรหัสผ่าน)
        สำเร็จ 302 ไป `/` พร้อม cookie session; ผิดพลาดทุกกรณี (state ไม่ตรง, หมดอายุ, ผู้ใช้กดยกเลิก, อีเมลไม่ได้ยืนยัน, provider ล่ม) 302 ไป `/login?error=oauth` ไม่รับ URL ปลายทางจาก query
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '302':
          description: ไป `/` (สำเร็จ) หรือ `/login?error=oauth`
          headers:
            Location: { schema: { type: string, enum: [/, /login?error=oauth] } }
            Set-Cookie: { schema: { type: string } }
  /api/config:
    get:
      summary: ค่าสาธารณะที่หน้าเว็บต้องใช้
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [turnstileSiteKey]
                additionalProperties: false
                properties:
                  turnstileSiteKey: { type: [string, 'null'], description: null เมื่อรัน `TURNSTILE_MODE=fake` หน้าเว็บส่ง `fake-pass` แทน widget }
  /api/me:
    get:
      summary: ผู้ใช้ปัจจุบัน
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/links:
    get:
      summary: ลิงก์ของผู้ใช้ปัจจุบัน ใหม่สุดก่อน
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LinkSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: สร้างลิงก์สั้น
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLink' }
      responses:
        '201': { description: สร้างแล้ว, content: { application/json: { schema: { $ref: '#/components/schemas/LinkSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/links/{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    patch:
      summary: แก้ปลายทาง (P1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties: { url: { $ref: '#/components/schemas/TargetUrl' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LinkSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: ลบลิงก์และสถิติของลิงก์
      responses:
        '204': { description: ลบแล้ว }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/links/{code}/stats:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      summary: สถิติ 30 วันล่าสุด (คืนครั้งเดียว จึงไม่มี state ข้อมูลมาไม่ครบ)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /{code}:
    parameters:
      - $ref: '#/components/parameters/Code'
    get:
      summary: เปิดลิงก์สั้น นับคลิกแล้วพาไปปลายทาง
      security: []
      responses:
        '302':
          description: ไปปลายทาง
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, const: no-store } }
        '404':
          description: หน้า HTML "ไม่พบลิงก์นี้"
          content: { text/html: { schema: { type: string } } }
  /health:
    get:
      summary: ตรวจว่า service ทำงาน
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, const: ok } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-session }
  headers:
    SessionCookie:
      description: __Host-session=<token สุ่ม 32 byte base64url>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=604800
      schema: { type: string }
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,30}[a-z0-9])?$' }
    Provider:
      name: provider
      in: path
      required: true
      description: provider อื่นตอบ 404 `not_found`
      schema: { type: string, enum: [google, github] }
  schemas:
    Captcha:
      type: string
      minLength: 1
      maxLength: 2048
      description: token จาก Cloudflare Turnstile widget ตรวจที่ server ด้วย siteverify ใช้ได้ครั้งเดียว ไม่มีหรือไม่ผ่านตอบ 403 `captcha_failed`
    RegisterBody:
      type: object
      required: [email, password, captcha]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        captcha: { $ref: '#/components/schemas/Captcha' }
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
    Me:
      type: object
      required: [email, emailVerified]
      properties:
        email: { type: string, format: email }
        emailVerified: { type: boolean, description: false แล้วสร้าง แก้ หรือลบลิงก์ไม่ได้ (403 email_unverified) }
    EmailToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: 32 byte base64url ไม่มี padding
    TokenBody:
      type: object
      required: [token]
      additionalProperties: false
      properties: { token: { $ref: '#/components/schemas/EmailToken' } }
    TargetUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https?://'
      description: ต้องเป็น http หรือ https และห้ามชี้กลับมาที่โดเมนของแอป
    CreateLink:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { $ref: '#/components/schemas/TargetUrl' }
        alias:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{1,30}[A-Za-z0-9])?$'
          description: ไม่สนตัวพิมพ์ เก็บเป็นตัวพิมพ์เล็ก ห้ามคำสงวน api app admin login logout register static assets health openapi verify-email forgot-password reset-password
    LinkSummary:
      type: object
      required: [code, url, createdAt, clicksTotal, last30Days]
      properties:
        code: { type: string }
        url: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        clicksTotal: { type: integer, minimum: 0 }
        last30Days:
          type: array
          minItems: 30
          maxItems: 30
          items: { type: integer, minimum: 0 }
          description: จำนวนคลิกรายวัน (UTC) เก่าสุดก่อน วันสุดท้ายคือวันนี้
    Stats:
      type: object
      required: [code, clicksTotal, daily, referrers]
      properties:
        code: { type: string }
        clicksTotal: { type: integer, minimum: 0 }
        daily:
          type: array
          minItems: 30
          maxItems: 30
          items:
            type: object
            required: [date, clicks]
            properties:
              date: { type: string, format: date }
              clicks: { type: integer, minimum: 0 }
        referrers:
          type: array
          maxItems: 10
          items:
            type: object
            required: [host, clicks]
            properties:
              host: { type: [string, 'null'], description: null คือไม่ทราบที่มา }
              clicks: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [unauthorized, forbidden_origin, email_unverified, not_found, email_taken, alias_taken, invalid_url, self_link, invalid_alias, reserved_alias, weak_password, invalid_body, token_invalid, captcha_failed, rate_limited, internal_error]
        field: { type: string, description: 'ช่องที่ผิด เช่น url, alias, email, password' }
  responses:
    Unauthorized:
      description: ไม่ได้เข้าสู่ระบบ session หมดอายุ หรือ email/รหัสผ่านไม่ถูกต้อง
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Origin ไม่ตรงกับแอป (`forbidden_origin`), ยังไม่ได้ยืนยัน email (`email_unverified` เฉพาะ endpoint ที่สร้าง แก้ หรือลบลิงก์) หรือ captcha ไม่ผ่าน (`captcha_failed` เฉพาะ register และ password/forgot)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TokenInvalid:
      description: token ผิด หมดอายุ ใช้แล้ว หรือผิดจุดประสงค์ (`token_invalid` ข้อความเดียวกันทุกกรณี)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: ไม่มีลิงก์นี้ หรือเป็นลิงก์ของคนอื่น (ตอบเหมือนกัน)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: alias หรือ email ถูกใช้แล้ว
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Invalid:
      description: ข้อมูลไม่ผ่านเงื่อนไข `code` และ `field` บอกสาเหตุ
