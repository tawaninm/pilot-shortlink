# Generate: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate   (run in backend-b/)
# sqlc needs cgo, so it runs in Docker on Windows. The generated code in internal/db/gen is committed.
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries.sql
    gen:
      go:
        package: gen
        out: internal/db/gen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
