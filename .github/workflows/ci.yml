name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: design tokens are in sync
        run: node design/build-tokens.mjs --check
      - name: contract types match api/openapi.yaml
        run: |
          pnpm -F contract types
          git diff --exit-code contract/src/schema.ts
      - run: pnpm -F contract typecheck

  # backend-a, backend-b, contract-a, contract-b, web and e2e jobs are added by their tickets (scratch tickets C1-C9)
