name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: design tokens are in sync
        run: node design/build-tokens.mjs --check
      - name: contract types match api/openapi.yaml
        run: |
          pnpm -F contract types
          git diff --exit-code contract/src/schema.ts
      - run: pnpm -F contract typecheck

  backend-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # master 2026-10-16 (a commit at least 3 days old); toolchain pinned to the version used locally
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  backend-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend-b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend-b/go.mod
          cache-dependency-path: backend-b/go.sum
      - run: go vet ./...
      - run: go test ./... # testcontainers-go uses the Docker daemon on the runner
      - run: docker build -f Dockerfile -t pilot-shortlink-b .. # context = repo root (web app is embedded)

  contract-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # master 2026-10-16 (a commit at least 3 days old); toolchain pinned to the version used locally
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - run: pnpm install --frozen-lockfile
      # wrangler's build command calls worker-build; it is not on the runner (review of C3)
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: python3 scripts/verify.py a

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: web types match api/openapi.yaml
        run: |
          pnpm -F web types
          git diff --exit-code web/src/schema.ts
      - run: pnpm -F web lint
      - run: pnpm -F web typecheck
      - run: pnpm -F web test
      - run: pnpm -F web build

  # contract-b and e2e jobs are added by their tickets (C8-C9)
